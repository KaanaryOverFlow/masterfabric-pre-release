failure_threshold: HIGH

approved_sdks:
  - name: "flutter"
    versions: ">=3.0.0"
  - name: "http"
    versions: ">=0.13.0"
  - name: "crypto"
    versions: ">=3.0.0"
  - name: "shared_preferences"
    versions: ">=2.0.0"
  - name: "sqflite"
    versions: ">=2.0.0"
  - name: "dio"
    versions: ">=4.0.0"

blacklisted_versions:
  - "http@<0.13.0"
  - "crypto@<3.0.0"
  - "shared_preferences@<2.0.0"
  - "sqflite@<2.0.0"
  - "dio@<4.0.0"
  - "uuid@<3.0.0"

minimum_acceptable_standards:
  symmetric_encryption: "AES-256-GCM"
  hashing: "SHA3-256"
  tls_version: "1.3"

hardcoded_secret_scan:
  enabled: true
  entropy_threshold: 4.5

required_hardening_flags:
  - "-fstack-protector-strong"
  - "-D_FORTIFY_SOURCE=2"
  - "-Wl,-z,relro"
  - "-Wl,-z,now"

binary_checks:
  strip_symbols: true
  pie_enabled: true
  stack_canary: true

memory_safety_checks: true
concurrency_checks: true
