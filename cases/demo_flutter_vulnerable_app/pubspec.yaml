name: demo_flutter_vulnerable_app
description: A Flutter application with intentional security vulnerabilities for testing MasterFabric Security Checker

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # VULNERABLE DEPENDENCIES
  http: ^0.12.2  # Outdated version with known vulnerabilities
  crypto: ^2.1.5  # Outdated crypto library
  shared_preferences: ^0.5.12  # Old version with security issues
  sqflite: ^1.3.2  # Outdated SQLite wrapper
  path_provider: ^1.6.27  # Old version
  
  # Additional vulnerable packages
  dio: ^3.0.10  # Outdated HTTP client
  json_annotation: ^3.1.1  # Old version
  uuid: ^2.2.2  # Outdated UUID generator

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  uses-material-design: true
